<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT NOTICED — Branch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,450&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0A0B0D;
    --void-2:#111319;
    --panel:#15171E;
    --panel-2:#191c24;
    --line:#262933;
    --bone:#EAE6DD;
    --bone-dim:#8B8B93;
    --ember:#D98C3D;
    --ember-dim:#7A5A34;
    --ghost:#7C7BA0;
    --ghost-dim:#3E3E56;
    --drift:#B4483F;
    --ok:#7FA37A;
    --serif:'Fraunces', serif;
    --mono:'JetBrains Mono', monospace;
    --sans:'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ background:var(--void); color:var(--bone); font-family:var(--sans); min-height:100vh; overflow-x:hidden; }
  body{
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(217,140,61,0.05), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 100%, rgba(124,123,160,0.04), transparent 60%);
  }
  ::selection{background:var(--ember-dim); color:var(--bone);}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}

  .shell{ max-width:520px; margin:0 auto; min-height:100vh; position:relative; display:flex; flex-direction:column; }

  header.top{ padding:22px 20px 14px; display:flex; align-items:baseline; justify-content:space-between; border-bottom:1px solid var(--line); }
  .brand{ font-family:var(--mono); font-size:12px; letter-spacing:0.18em; color:var(--bone-dim); }
  .brand b{color:var(--ember); font-weight:600;}
  .tagline{ font-family:var(--serif); font-style:italic; font-size:11px; color:var(--ghost); letter-spacing:.01em; margin-top:3px; }
  .clock{ font-family:var(--mono); font-size:11px; color:var(--bone-dim); letter-spacing:0.05em; }

  nav.tabs{ display:flex; border-bottom:1px solid var(--line); background:var(--void-2); }
  nav.tabs button{ flex:1; background:none; border:none; color:var(--bone-dim); font-family:var(--mono); font-size:10.5px; letter-spacing:0.16em; padding:16px 4px; cursor:pointer; position:relative; transition:color .25s ease; }
  nav.tabs button.active{color:var(--bone);}
  nav.tabs button.active::after{ content:""; position:absolute; left:16%; right:16%; bottom:0; height:2px; background:var(--ember); }
  nav.tabs button:hover{color:var(--bone);}

  main{ flex:1; padding:26px 20px 60px; animation:fadeIn .5s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeInFast{ from{opacity:0;} to{opacity:1;} }
  @keyframes riseIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .eyebrow{ font-family:var(--mono); font-size:10px; letter-spacing:0.16em; color:var(--ghost); margin-bottom:8px; }
  h1{ font-family:var(--serif); font-weight:450; font-size:26px; line-height:1.25; letter-spacing:-0.01em; color:var(--bone); margin-bottom:6px; }
  h1 em{font-style:italic; color:var(--ember); font-weight:450;}
  .sub{ font-size:13px; color:var(--bone-dim); line-height:1.5; margin-bottom:22px; max-width:42ch; }

  /* ---- breadcrumb / drilldown ---- */
  .crumb{ display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:var(--bone-dim); margin-bottom:14px; flex-wrap:wrap; }
  .crumb .seg{cursor:pointer;}
  .crumb .seg:hover{color:var(--bone);}
  .crumb .seg.current{color:var(--ember); cursor:default;}
  .crumb .sep{color:var(--ghost-dim);}
  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:none; border:1px solid var(--line); color:var(--bone-dim);
    font-family:var(--mono); font-size:10px; letter-spacing:.08em;
    padding:7px 12px; cursor:pointer; border-radius:2px; margin-bottom:14px;
  }
  .back-btn:hover{color:var(--bone); border-color:var(--ghost-dim);}

  /* ---- Tree screen ---- */
  .tree-wrap{ position:relative; width:100%; aspect-ratio:1/1.05; margin-bottom:8px; }
  .tree-wrap svg{width:100%; height:100%; overflow:visible;}
  .branch{ fill:none; stroke-linecap:round; cursor:pointer; transition:opacity .2s ease; }
  .branch.dimmed{opacity:.12 !important;}
  .node-label{ font-family:var(--mono); font-size:9.5px; fill:var(--bone-dim); letter-spacing:.03em; }
  .now-core{ fill:var(--void); stroke:var(--bone); stroke-width:1.4; }
  .now-core-glow{ fill:none; stroke:var(--ember); stroke-width:1; opacity:.35; animation:pulse 3.2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:.15; r:15;} 50%{opacity:.4; r:19;} }

  .confidence-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border:1px solid var(--line); background:var(--panel); border-radius:2px; margin-top:6px; font-family:var(--mono); font-size:10.5px; }
  .confidence-row .k{color:var(--bone-dim); letter-spacing:.1em;}
  .confidence-row .v{color:var(--drift); letter-spacing:.06em; transition:color .3s ease;}
  .confidence-row .v.rising{color:var(--ok);}

  .future-list{ margin-top:18px; display:flex; flex-direction:column; gap:1px; border:1px solid var(--line); }
  .future-row{ display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--panel); cursor:pointer; transition:background .2s ease; }
  .future-row:hover{background:var(--panel-2);}
  .future-row .bar-track{ flex:1; height:3px; background:var(--void-2); position:relative; border-radius:2px; overflow:hidden; }
  .future-row .bar-fill{ position:absolute; left:0; top:0; bottom:0; background:var(--ember); border-radius:2px; transition:width .4s ease; }
  .future-row .name{ font-family:var(--sans); font-size:13px; color:var(--bone); width:118px; flex-shrink:0; display:flex; align-items:center; gap:6px;}
  .future-row .name .chev{color:var(--ghost); font-size:10px;}
  .future-row .pct{ font-family:var(--mono); font-size:12px; color:var(--ember); width:36px; text-align:right; flex-shrink:0; }
  .future-row .bump{ font-family:var(--mono); font-size:9px; color:var(--ok); margin-left:4px; animation:riseIn .3s ease; }

  .past-strip{ display:flex; gap:8px; margin-top:14px; overflow-x:auto; padding-bottom:6px; }
  .past-chip{ font-family:var(--mono); font-size:10px; color:var(--ghost); border:1px solid var(--ghost-dim); padding:6px 10px; white-space:nowrap; border-radius:100px; flex-shrink:0; cursor:pointer; background:none; transition:all .2s ease;}
  .past-chip:hover{color:var(--bone); border-color:var(--ghost);}
  .past-chip.active{background:var(--ghost-dim); color:var(--bone);}

  .node-detail{
    margin-top:14px; border:1px solid var(--ghost-dim); background:var(--panel);
    animation:riseIn .3s ease; overflow:hidden;
  }
  .node-detail .nd-head{
    padding:12px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;
  }
  .node-detail .nd-head h4{font-family:var(--serif); font-size:15px; font-weight:450;}
  .node-detail .nd-head .close-x{background:none; border:none; color:var(--bone-dim); cursor:pointer; font-size:14px;}
  .node-detail .nd-body{padding:14px;}
  .growth-line{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-family:var(--mono); font-size:11px; color:var(--bone-dim); margin-bottom:12px;
  }
  .growth-line .arrow{color:var(--ghost);}
  .growth-line .now-val{color:var(--ember); font-weight:600;}
  .criteria-grid{ display:flex; flex-direction:column; gap:8px; }
  .criteria-item{ display:flex; align-items:center; gap:10px; }
  .criteria-item .c-label{ font-family:var(--mono); font-size:9px; letter-spacing:.08em; color:var(--bone-dim); width:76px; flex-shrink:0;}
  .criteria-item .c-track{flex:1; height:4px; background:var(--void-2); border-radius:2px; overflow:hidden;}
  .criteria-item .c-fill{height:100%; background:var(--ghost); border-radius:2px;}
  .criteria-item .c-val{font-family:var(--mono); font-size:10px; color:var(--ghost); width:28px; text-align:right;}

  /* ---- Decision screen ---- */
  .field-label{ font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--bone-dim); margin-bottom:8px; display:block; }
  textarea, input[type=text]{ width:100%; background:var(--panel); border:1px solid var(--line); color:var(--bone); font-family:var(--serif); font-size:17px; padding:14px; border-radius:2px; resize:none; outline:none; }
  textarea:focus, input[type=text]:focus{border-color:var(--ember-dim);}
  textarea::placeholder, input::placeholder{color:#54565f;}

  .cat-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:16px; }
  .cat-pill{
    background:none; border:1px solid var(--line); color:var(--bone-dim);
    font-family:var(--mono); font-size:10px; letter-spacing:.05em;
    padding:8px 12px; cursor:pointer; border-radius:100px; transition:all .2s ease;
  }
  .cat-pill.active{background:var(--ember); border-color:var(--ember); color:var(--void);}
  .cat-pill:hover:not(.active){border-color:var(--ghost-dim); color:var(--bone);}

  .opt-row{ display:flex; gap:8px; margin-top:10px; }
  .opt-row input{flex:1; font-size:14px; font-family:var(--sans); padding:11px 12px;}
  .opt-row button.rm{ background:none; border:1px solid var(--line); color:var(--bone-dim); width:38px; cursor:pointer; font-family:var(--mono); border-radius:2px; }
  .add-opt{ margin-top:10px; background:none; border:1px dashed var(--line); color:var(--bone-dim); font-family:var(--mono); font-size:11px; letter-spacing:.08em; padding:10px; width:100%; cursor:pointer; border-radius:2px; }
  .add-opt:hover{color:var(--bone); border-color:var(--ghost-dim);}

  .btn{ font-family:var(--mono); font-size:11px; letter-spacing:.1em; padding:14px 20px; border:1px solid var(--ember); background:transparent; color:var(--ember); cursor:pointer; width:100%; margin-top:18px; border-radius:2px; transition:all .2s ease; }
  .btn:hover{background:var(--ember); color:var(--void);}
  .btn:disabled{opacity:.3; cursor:not-allowed;}
  .btn:disabled:hover{background:transparent; color:var(--ember);}
  .btn.subtle{border-color:var(--ghost); color:var(--ghost);}
  .btn.subtle:hover{background:var(--ghost); color:var(--void);}

  .predicted-block{ margin-top:22px; border:1px solid var(--line); animation:riseIn .3s ease;}
  .predict-tag{ font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; color:var(--ghost); padding:10px 14px; border-bottom:1px solid var(--line); background:var(--void-2); }
  .choice-row{ display:flex; align-items:center; justify-content:space-between; padding:15px 14px; background:var(--panel); border-bottom:1px solid var(--line); cursor:pointer; transition:background .2s ease; }
  .choice-row:last-child{border-bottom:none;}
  .choice-row:hover{background:var(--panel-2);}
  .choice-row.selected{background:var(--ember-dim);}
  .choice-row .c-name{font-size:14px;}
  .choice-row .c-pct{font-family:var(--mono); font-size:13px; color:var(--bone-dim);}
  .choice-row.is-predicted .c-pct{color:var(--ember); font-weight:600;}

  .recorded-box{ margin-top:18px; padding:16px; border:1px solid var(--ember-dim); animation:fadeInFast .4s ease; }
  .recorded-box .rb-top{ text-align:center; color:var(--ember); font-family:var(--mono); font-size:11px; letter-spacing:.14em; margin-bottom:10px;}
  .recorded-box .rb-effect{ text-align:center; font-family:var(--mono); font-size:10.5px; color:var(--ok); }

  .hist-section{margin-top:32px;}
  .hist-item{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
  .hist-item:last-child{border-bottom:none;}
  .hist-item .hi-mark{ width:16px; text-align:center; font-family:var(--mono); font-size:11px; flex-shrink:0;}
  .hist-item .hi-mark.match{color:var(--ok);}
  .hist-item .hi-mark.diff{color:var(--drift);}
  .hist-item .hi-main{flex:1; min-width:0;}
  .hist-item .hi-text{font-size:12.5px; color:var(--bone); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hist-item .hi-meta{font-family:var(--mono); font-size:9.5px; color:var(--bone-dim); margin-top:2px;}
  .hist-item .hi-cat{font-family:var(--mono); font-size:8.5px; color:var(--ghost); border:1px solid var(--ghost-dim); padding:2px 6px; border-radius:100px; flex-shrink:0;}

  /* ---- Morning screen ---- */
  .morning-item{ border:1px solid var(--line); margin-bottom:14px; background:var(--panel); }
  .morning-item .mi-head{ padding:12px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .morning-item .mi-head .time{font-family:var(--mono); font-size:10px; color:var(--bone-dim);}
  .morning-item .mi-head .predicted{font-family:var(--mono); font-size:10px; color:var(--ember);}
  .morning-item .mi-body{padding:14px;}
  .morning-item .mi-body .decision-text{font-family:var(--serif); font-size:16px; margin-bottom:4px;}
  .morning-item .mi-body .chosen{font-size:12px; color:var(--bone-dim); margin-bottom:12px;}
  .outcome-btns{display:flex; gap:6px; margin-bottom:12px;}
  .outcome-btns button{ flex:1; background:none; border:1px solid var(--line); color:var(--bone-dim); font-family:var(--mono); font-size:10px; padding:9px 4px; cursor:pointer; border-radius:2px; }
  .outcome-btns button.on{background:var(--bone); color:var(--void); border-color:var(--bone);}

  .context-field{margin-bottom:12px;}
  .context-field textarea{ font-family:var(--sans); font-size:12.5px; padding:10px; min-height:44px; }
  .context-field .field-label{margin-bottom:5px;}

  .mood-guess{ font-family:var(--serif); font-style:italic; font-size:13.5px; color:var(--ghost); border-left:2px solid var(--ghost-dim); padding:8px 0 8px 12px; margin-top:4px; }
  .mood-guess .lbl{ display:block; font-family:var(--mono); font-style:normal; font-size:9px; letter-spacing:.1em; color:var(--bone-dim); margin-bottom:4px; }
  .mood-actions{display:flex; gap:14px; margin-top:8px;}
  .mood-actions button{ background:none; border:none; color:var(--bone-dim); font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; cursor:pointer; padding:0; }
  .mood-actions button.ok{color:var(--ember);}
  .mood-actions button.on{color:var(--bone);}
  .mood-edit{margin-top:8px; display:flex; gap:6px;}
  .mood-edit input{font-family:var(--sans); font-size:12px; padding:8px 10px;}
  .mood-edit button{background:var(--ember); border:none; color:var(--void); font-family:var(--mono); font-size:10px; padding:0 12px; border-radius:2px; cursor:pointer;}

  .empty-note{ font-family:var(--mono); font-size:11px; color:var(--bone-dim); text-align:center; padding:30px 10px; border:1px dashed var(--line); }

  .update-box{ margin-top:8px; text-align:center; padding:20px; border:1px solid var(--ember-dim); animation:riseIn .4s ease; }
  .update-box .ub-top{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--ember); margin-bottom:6px;}
  .update-box .ub-sub{font-family:var(--mono); font-size:10px; color:var(--bone-dim);}

  /* ---- Ghost screen ---- */
  .divergence-select{ display:flex; flex-direction:column; gap:1px; border:1px solid var(--line); margin-bottom:20px; }
  .divergence-select button{ text-align:left; background:var(--panel); border:none; color:var(--bone); font-family:var(--sans); font-size:13px; padding:13px 14px; cursor:pointer; transition:background .2s ease; }
  .divergence-select button:hover{background:var(--panel-2);}
  .divergence-select button.active{background:var(--ghost-dim); color:var(--bone);}
  .divergence-select button .tag{ display:block; font-family:var(--mono); font-size:9.5px; color:var(--ghost); margin-top:2px; }

  .ghost-header{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--ghost); border-top:1px solid var(--ghost-dim); border-bottom:1px solid var(--ghost-dim); padding:10px 0; margin-bottom:2px; }
  .ghost-card{ border-left:2px solid var(--ghost-dim); padding:14px 0 14px 16px; margin-left:4px; position:relative; cursor:pointer; }
  .ghost-card::before{ content:""; position:absolute; left:-5px; top:20px; width:8px; height:8px; border-radius:50%; background:var(--void); border:2px solid var(--ghost); }
  .ghost-card .gh-meta{ font-family:var(--mono); font-size:9.5px; color:var(--bone-dim); letter-spacing:.06em; margin-bottom:6px; }
  .ghost-card .gh-meta .conf{color:var(--ghost);}
  .ghost-card h3{ font-family:var(--serif); font-weight:450; font-size:16px; margin-bottom:5px; color:var(--bone); }
  .ghost-card p{ font-size:12.5px; color:var(--bone-dim); line-height:1.55; max-width:44ch; }
  .ghost-card .gh-extra{ font-size:12.5px; color:var(--ghost); line-height:1.55; max-width:44ch; margin-top:8px; animation:riseIn .3s ease;}
  .ghost-card .gh-toggle{font-family:var(--mono); font-size:9px; color:var(--ghost); margin-top:8px; letter-spacing:.06em;}
  .ghost-quote{ font-family:var(--serif); font-style:italic; font-size:13.5px; color:var(--ghost); text-align:center; padding:20px 10px 4px; line-height:1.6; }

  footer.foot{ padding:16px 20px 26px; font-family:var(--mono); font-size:9.5px; color:#4d4f58; text-align:center; letter-spacing:.06em; border-top:1px solid var(--line); }

  @media (max-width:400px){ .future-row .name{width:92px; font-size:12px;} }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div>
      <div class="brand"><b>IT</b> NOTICED</div>
      <div class="tagline">before you did</div>
    </div>
    <div class="clock" id="clock">—</div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-screen="now">ŞİMDİ</button>
    <button class="tab-btn" data-screen="decision">KARAR</button>
    <button class="tab-btn" data-screen="morning">GÜNLÜK</button>
    <button class="tab-btn" data-screen="ghost">GHOST</button>
  </nav>

  <main id="main"></main>

  <footer class="foot">DEMO SÜRÜMÜ · VERİ CİHAZDA KALIR · FAZ 0</footer>
</div>

<script>
/* ============ DATA ============ */
const futureTree = [
  { name:'Embedded', pct:31, children:[
    {name:'Gömülü Yazılım', pct:18},
    {name:'Sensör / IoT', pct:9},
    {name:'Robotik', pct:4},
  ]},
  { name:'Mevcut Düzen', pct:24, children:[
    {name:'Şu Anki İş', pct:16},
    {name:'Yan Proje', pct:8},
  ]},
  { name:'Farklı Alan', pct:18, children:[
    {name:'Veri / AI', pct:11},
    {name:'Ürün Yönetimi', pct:7},
  ]},
  { name:'Startup', pct:15, children:[
    {name:'Kendi Girişimi', pct:9},
    {name:'Erken Ekip', pct:6},
  ]},
  { name:'Akademi', pct:7, children:[
    {name:'Yüksek Lisans', pct:5},
    {name:'Araştırma', pct:2},
  ]},
];

const pastNodes = [
  { id:'takim', label:'Takıma katıldın', importanceFirst:8, importanceNow:79,
    date:'14 hafta önce', baglanti:9, kapsam:8, fark:7, sure:9, duygu:6 },
  { id:'yurtdisi', label:'Yurtdışı programına başvurdun', importanceFirst:22, importanceNow:64,
    date:'11 hafta önce', baglanti:7, kapsam:6, fark:8, sure:6, duygu:8 },
  { id:'dil', label:'İkinci dili bıraktın', importanceFirst:14, importanceNow:19,
    date:'9 hafta önce', baglanti:3, kapsam:2, fark:4, sure:3, duygu:5 },
  { id:'tasin', label:'Yeni çevreye taşındın', importanceFirst:31, importanceNow:41,
    date:'6 hafta önce', baglanti:6, kapsam:7, fark:5, sure:6, duygu:7 },
];

const categories = ['Kariyer','İlişki','Sağlık','Para','Sosyal'];
const catToFuture = {'Kariyer':'Embedded','İlişki':'Mevcut Düzen','Sağlık':'Farklı Alan','Para':'Startup','Sosyal':'Akademi'};

/* ============ STATE (in-memory only, resets on reload) ============ */
const state = {
  screen: 'now',

  // now/tree
  treePath: [],            // e.g. ['Embedded'] when drilled in
  selectedPast: null,      // id of past node detail open
  confidenceRising: false,

  // decision
  decisionOptions: ['Çalış', 'Dinlen', 'Dışarı çık'],
  decisionText: '',
  decisionCategory: null,
  predicted: null,
  chosen: null,
  recorded: false,
  lastBump: null,

  decisionHistory: [
    {date:'Dün 21:34', cat:'Sağlık', text:'Bu akşam ne yapacaksın?', predicted:'Dinlen', chosen:'Çalış', match:false},
    {date:'Dün 13:10', cat:'Sosyal', text:'Öğle arasında ne yiyeceksin?', predicted:'Dışarıda', chosen:'Dışarıda', match:true},

/* ============ CLOCK ============ */
function tickClock(){
  const d = new Date();

  document.getElementById('clock').textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());

});
function setActiveTab(){
  document.querySelectorAll('.tab-btn').forEach(b=>{ b.classList.toggle('active', b.dataset.screen === state.screen); });
}

/* ============ RENDER ROUTER ============ */
function render(){
  setActiveTab();
  const main = document.getElementById('main');
  if(state.screen==='now') main.innerHTML = renderNow();
  if(state.screen==='decision') main.innerHTML = renderDecision();
  if(state.screen==='morning') main.innerHTML = renderMorning();
  if(state.screen==='ghost') main.innerHTML = renderGhost();
  bindScreenEvents();
}

/* ============ HELPERS ============ */
function getCurrentLevel(){
  // returns {parentName, parentPct, nodes[]}
  if(state.treePath.length===0){
    return { parentName:null, parentPct:100, nodes: futureTree };
  }
  let nodes = futureTree; let parent = null;
  for(const name of state.treePath){
    parent = nodes.find(n=>n.name===name);
    nodes = parent && parent.children ? parent.children : [];
  }
  return { parentName: parent ? parent.name : null, parentPct: parent ? parent.pct : 100, nodes };
}

/* ============ SCREEN: NOW / TREE ============ */
function renderNow(){
  const level = getCurrentLevel();
  const nodes = level.nodes;
  const total = level.parentPct;
  const spread = 140;
  const startAngle = -90 - spread/2;
  let acc = 0;
  const sumPct = nodes.reduce((a,f)=>a+f.pct,0) || 1;

  const branches = nodes.map((f)=>{
    const a = startAngle + (spread * (acc + f.pct/2/sumPct));
    acc += f.pct/sumPct;
    const rad = a * Math.PI/180;
    const shareOfTotal = f.pct; // absolute out of 100 always
    const len = 92 + (shareOfTotal*1.6);
    const x2 = 150 + Math.cos(rad)*len;
    const y2 = 195 + Math.sin(rad)*len;
    const stroke = 1 + (shareOfTotal/100)*7;
    const opacity = 0.35 + (shareOfTotal/100)*1.3;
    return '<line class="branch" data-branch="'+f.name+'" x1="150" y1="195" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="var(--ember)" stroke-width="'+stroke.toFixed(1)+'" opacity="'+Math.min(opacity,1).toFixed(2)+'"/>';
  }).join('');

  const pastBranches = pastNodes.slice(0,4).map((p,i)=>{
    const bw = 0.8 + (p.importanceNow/100)*2.2;
    const op = 0.25 + (p.importanceNow/100)*0.5;
    return '<line class="branch" data-past="'+p.id+'" x1="150" y1="195" x2="'+(150-46+i*30).toFixed(1)+'" y2="'+(195-40-i*8).toFixed(1)+'" stroke="var(--ghost)" stroke-width="'+bw.toFixed(1)+'" opacity="'+op.toFixed(2)+'"/>';
  }).join('');

  const crumb = state.treePath.length===0
    ? '<span class="seg current">ŞİMDİ</span>'
    : '<span class="seg" data-crumb="-1">ŞİMDİ</span>' + state.treePath.map((p,i)=>{
        const isLast = i===state.treePath.length-1;
        return '<span class="sep">›</span><span class="seg '+(isLast?'current':'')+'" data-crumb="'+i+'">'+p+'</span>';
      }).join('');

  let detailBlock = '';
  if(state.selectedPast){
    const p = pastNodes.find(x=>x.id===state.selectedPast);
    if(p){
      const rows = [
        ['BAĞLANTI', p.baglanti], ['KAPSAM', p.kapsam], ['FARK', p.fark], ['SÜRE', p.sure], ['DUYGU', p.duygu]
      ].map(r=>'<div class="criteria-item"><span class="c-label">'+r[0]+'</span><span class="c-track"><span class="c-fill" style="width:'+(r[1]*10)+'%"></span></span><span class="c-val">'+r[1]+'/10</span></div>').join('');
      detailBlock = '<div class="node-detail">'
        + '<div class="nd-head"><h4>'+p.label+'</h4><button class="close-x" id="closePast">×</button></div>'
        + '<div class="nd-body">'
        + '<div class="growth-line"><span>İLK KAYIT: %'+p.importanceFirst+' önem</span><span class="arrow">→</span><span class="now-val">ŞİMDİ: %'+p.importanceNow+' önem</span></div>'
        + '<div class="criteria-grid">'+rows+'</div>'
        + '<div style="font-family:var(--mono); font-size:9.5px; color:var(--bone-dim); margin-top:12px;">'+p.date+' kaydedildi</div>'
        + '</div></div>';
    }
  }

  return ''
    + '<div class="eyebrow">ŞİMDİKİ BENLİK</div>'
    + '<h1>Önündeki en olası <em>beş gelecek</em>.</h1>'
    + '<p class="sub">Bir dalın üzerine tıkla; içinden yayılan daha ince dalları gör. Bir geçmiş düğümüne tıkla; neden büyüdüğünü gör.</p>'
    + '<div class="crumb">'+crumb+'</div>'
    + '<div class="tree-wrap"><svg viewBox="0 0 300 260">'
    + pastBranches + branches
    + '<circle class="now-core-glow" cx="150" cy="195" r="16"/>'
    + '<circle class="now-core" cx="150" cy="195" r="7"/>'
    + '<text x="150" y="222" text-anchor="middle" class="node-label">ŞİMDİ</text>'
    + '</svg></div>'
    + '<div class="confidence-row"><span class="k">GÜVEN SEVİYESİ</span><span class="v '+(state.confidenceRising?'rising':'')+'">'+(state.confidenceRising?'ORTA (yükseliyor)':'DÜŞÜK')+'</span></div>'
    + '<div class="future-list">'
    + nodes.map(f=>{
        const hasChildren = f.children && f.children.length>0;
        return '<div class="future-row" data-future="'+f.name+'">'
          + '<span class="name">'+f.name+(hasChildren?' <span class="chev">›</span>':'')+'</span>'
          + '<span class="bar-track"><span class="bar-fill" style="width:'+((f.pct/sumPct)*100)+'%"></span></span>'
          + '<span class="pct">'+f.pct+'%'+(state.lastBump && state.lastBump.name===f.name ? '<span class="bump">+'+state.lastBump.amount+'</span>' : '')+'</span>'
          + '</div>';
      }).join('')
    + '</div>'
    + (state.treePath.length===0 ? (
      '<div class="eyebrow" style="margin-top:22px;">ETKİLİ GEÇMİŞ</div>'
      + '<div class="past-strip">'
      + pastNodes.map(p=>'<button class="past-chip '+(state.selectedPast===p.id?'active':'')+'" data-past-chip="'+p.id+'">'+p.label+' · %'+p.importanceNow+'</button>').join('')
      + '</div>'
    ) : '')
    + detailBlock;
}

/* ============ SCREEN: DECISION ============ */
function renderDecision(){
  const optsHtml = state.decisionOptions.map((o,i)=>{
    const rmBtn = state.decisionOptions.length>2 ? '<button class="rm" data-idx="'+i+'">×</button>' : '';
    return '<div class="opt-row"><input type="text" value="'+o+'" data-idx="'+i+'" class="opt-input" placeholder="Seçenek '+(i+1)+'"/>'+rmBtn+'</div>';
  }).join('');

  const catRow = '<div class="cat-row">' + categories.map(c=>'<button class="cat-pill '+(state.decisionCategory===c?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join('') + '</div>';

  let predictBlock = '';
  if(state.predicted && !state.recorded){
    predictBlock = '<div class="predicted-block"><div class="predict-tag">AI TAHMİNİ · SEÇECEĞİN SEÇENEK DEĞİL, SEÇME İHTİMALİN</div>'
      + state.decisionOptions.map(o=>{
          const isPred = o===state.predicted.name;
          const pct = isPred ? state.predicted.pct : Math.round((100-state.predicted.pct)/(state.decisionOptions.length-1));
          return '<div class="choice-row '+(isPred?'is-predicted':'')+' '+(state.chosen===o?'selected':'')+'" data-choice="'+o+'"><span class="c-name">'+o+'</span><span class="c-pct">'+pct+'%</span></div>';
        }).join('')
      + '</div>';
  }

  let recordedBlock = '';
  if(state.recorded){
    const future = catToFuture[state.decisionCategory] || null;
    recordedBlock = '<div class="recorded-box"><div class="rb-top">RECORDED · "'+state.chosen+'" kaydedildi</div>'
      + (future ? '<div class="rb-effect">Bu karar "'+future+'" dalını +'+(state.lastBump?state.lastBump.amount:1)+' güçlendirdi</div>' : '')
      + '</div>';
  }

  const histHtml = state.decisionHistory.map(h=>{
    return '<div class="hist-item"><span class="hi-mark '+(h.match?'match':'diff')+'">'+(h.match?'✓':'≠')+'</span>'
      + '<div class="hi-main"><div class="hi-text">'+h.text+'</div><div class="hi-meta">'+h.date+' · tahmin: '+h.predicted+' · seçim: '+h.chosen+'</div></div>'
      + '<span class="hi-cat">'+h.cat+'</span></div>';
  }).join('');

  return ''
    + '<div class="eyebrow">KARAR ANI</div>'
    + '<h1>Ne yapacaksın?</h1>'
    + '<p class="sub">Metni yaz, bir kategori seç, en fazla üç seçenek gir. Tahmin, doğru seçeneği değil senin seçme ihtimalini gösterir.</p>'
    + '<label class="field-label">KARAR</label>'
    + '<textarea id="decisionText" rows="2" placeholder="Örn. Bu akşam ne yapacaksın?">'+state.decisionText+'</textarea>'
    + '<label class="field-label" style="margin-top:14px;">BAĞLAM</label>'
    + catRow
    + '<label class="field-label" style="margin-top:16px; display:block;">SEÇENEKLER</label>'
    + '<div id="optsList">'+optsHtml+'</div>'
    + (state.decisionOptions.length<3 ? '<button class="add-opt" id="addOpt">+ SEÇENEK EKLE</button>' : '')
    + '<button class="btn" id="predictBtn" '+(state.recorded?'disabled':'')+'>TAHMİN ET</button>'
    + predictBlock
    + recordedBlock
    + '<div class="hist-section"><div class="eyebrow">GEÇMİŞ KARARLAR</div>'+histHtml+'</div>';
}

/* ============ SCREEN: GÜNLÜK (day-long: pending verification + running today timeline) ============ */
function renderMorning(){
  const hour = new Date().getHours();
  const isMorningWindow = hour < 12;
  const pending = state.log.filter(i=>!i.outcome);
  const verified = state.log.filter(i=>i.outcome);
  const today = state.decisionHistory.filter(h=>h.date==='şimdi');

  // ---- heading, adapts to time of day + what's actually pending ----
  let eyebrow, heading, sub;
  if(pending.length>0){
    eyebrow = isMorningWindow ? 'SABAH DOĞRULAMASI' : 'BEKLEYEN DOĞRULAMA';
    heading = '<h1>'+(isMorningWindow?'Günaydın. ':'')+'Doğrulanmayı bekleyen <em>'+pending.length+'</em> karar var.</h1>';
    sub = 'Sonucu doğrula, kısa bağlam ekle, ruh hâli tahminini onayla ya da düzelt.';
  } else if(today.length>0){
    eyebrow = 'GÜNLÜK';
    heading = '<h1>Bugün <em>'+today.length+'</em> karar kaydettin.</h1>';
    sub = 'Doğrulanacak bir şey yok. Aşağıda bugünün akışı var; yarın sabah sonuçlarını soracağız.';
  } else {
    eyebrow = 'GÜNLÜK';
    heading = '<h1>Henüz bugün bir şey yok.</h1>';
    sub = 'Karar sekmesinden bir şey kaydettiğinde burada, gün boyunca, birikerek görünür.';
  }

  // ---- pending verification cards ----
  const pendingHtml = pending.length===0 ? '' : ('<div class="eyebrow" style="margin-top:4px;">'+(verified.length>0?'KALAN':'BEKLEYEN')+'</div>' +
    pending.map((item)=>{
      const idx = state.log.indexOf(item);
      const moodBlock = item.moodEditing
        ? '<div class="mood-edit"><input type="text" id="moodInput'+idx+'" value="'+item.moodGuess+'"/><button data-save-mood="'+idx+'">KAYDET</button></div>'
        : ('<div class="mood-guess"><span class="lbl">RUH HÂLİ TAHMİNİ</span>"'+item.moodGuess+'"'
          + '<div class="mood-actions"><button data-mood="onayla" data-idx="'+idx+'" class="'+(item.moodConfirmed==='onayla'?'ok':'')+'">ONAYLA</button>'
          + '<button data-mood="duzelt" data-idx="'+idx+'" class="'+(item.moodConfirmed==='duzelt'?'on':'')+'">DÜZELT</button></div></div>');

      return '<div class="morning-item" data-idx="'+idx+'">'
        + '<div class="mi-head"><span class="time">'+item.time+'</span><span class="predicted">TAHMİN: '+item.predicted.toUpperCase()+' %'+item.predictedPct+'</span></div>'
        + '<div class="mi-body">'
        + '<div class="decision-text">'+item.text+'</div>'
        + '<div class="chosen">Seçtiğin: '+item.chosen+'</div>'
        + '<label class="field-label">GERÇEKTE NE OLDU?</label>'
        + '<div class="outcome-btns">'
        + '<button data-outcome="tam" class="'+(item.outcome==='tam'?'on':'')+'">Tam olarak yaptım</button>'
        + '<button data-outcome="kismen" class="'+(item.outcome==='kismen'?'on':'')+'">Kısmen yaptım</button>'
        + '<button data-outcome="hayir" class="'+(item.outcome==='hayir'?'on':'')+'">Yapmadım</button>'
        + '</div>'
        + '<div class="context-field"><label class="field-label">KISA BAĞLAM (isteğe bağlı)</label>'
        + '<textarea rows="2" data-context-idx="'+idx+'" placeholder="Neden böyle oldu?">'+item.context+'</textarea></div>'
        + moodBlock
        + '</div></div>';
    }).join(''));

  // ---- running "today" timeline, fed by whatever gets recorded on the KARAR tab ----
  const todayHtml = today.length===0 ? '' : ('<div class="hist-section" style="margin-top:'+(pending.length>0?'30':'6')+'px;">'
    + '<div class="eyebrow">BUGÜN</div>'
    + today.map(h=>'<div class="hist-item"><span class="hi-mark '+(h.match?'match':'diff')+'">'+(h.match?'✓':'≠')+'</span>'
        + '<div class="hi-main"><div class="hi-text">'+h.text+'</div><div class="hi-meta">tahmin: '+h.predicted+' · seçim: '+h.chosen+'</div></div>'
        + '<span class="hi-cat">'+h.cat+'</span></div>').join('')
    + '</div>');

  // ---- update-tree action once everything currently pending is cleared ----
  let updateBlock = '';
  if(state.log.length>0 && pending.length===0){
    updateBlock = state.treeUpdated
      ? '<div class="update-box"><div class="ub-top">AĞAÇ GÜNCELLENDİ</div><div class="ub-sub">Güven seviyesi bir sonraki doğrulamayla birlikte yeniden hesaplanacak.</div></div>'
      : '<button class="btn" id="updateTreeBtn">AĞACI GÜNCELLE</button>';
  }

  return ''
    + '<div class="eyebrow">'+eyebrow+'</div>'
    + heading
    + '<p class="sub">'+sub+'</p>'
    + pendingHtml
    + todayHtml
    + (today.length===0 && pending.length===0 ? '<div class="empty-note">Henüz bugün için kaydedilmiş karar yok.</div>' : '')
    + updateBlock;
}

/* ============ EVENTS PER SCREEN ============ */
function bindScreenEvents(){

  if(state.screen==='now'){
    document.querySelectorAll('[data-future]').forEach(row=>{
      row.addEventListener('click', ()=>{
        const name = row.dataset.future;
        const level = getCurrentLevel();
        const node = level.nodes.find(n=>n.name===name);
        if(node && node.children && node.children.length){
          state.treePath.push(name);
          state.selectedPast = null;
          render();
        }
      });
    });
    document.querySelectorAll('[data-crumb]').forEach(seg=>{
      seg.addEventListener('click', ()=>{
        const idx = +seg.dataset.crumb;
        state.treePath = idx===-1 ? [] : state.treePath.slice(0, idx+1);
        render();
      });
    });
    document.querySelectorAll('[data-past-chip]').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const id = chip.dataset.pastChip;
        state.selectedPast = state.selectedPast===id ? null : id;
        render();
      });
    });
    document.querySelectorAll('[data-past]').forEach(branch=>{
      branch.addEventListener('click', ()=>{
        const id = branch.dataset.past;
        state.selectedPast = state.selectedPast===id ? null : id;
        render();
      });
    });
    const closePast = document.getElementById('closePast');
    if(closePast) closePast.addEventListener('click', ()=>{ state.selectedPast=null; render(); });
  }

  if(state.screen==='decision'){
    const dt = document.getElementById('decisionText');
    if(dt) dt.addEventListener('input', e=>{ state.decisionText = e.target.value; });

    document.querySelectorAll('[data-cat]').forEach(pill=>{
      pill.addEventListener('click', e=>{
        state.decisionCategory = pill.dataset.cat === state.decisionCategory ? null : pill.dataset.cat;
        render();
      });
    });

    document.querySelectorAll('.opt-input').forEach(inp=>{
      inp.addEventListener('input', e=>{ state.decisionOptions[+e.target.dataset.idx] = e.target.value; });
    });
    document.querySelectorAll('.rm').forEach(b=>{
      b.addEventListener('click', e=>{ state.decisionOptions.splice(+e.target.dataset.idx,1); render(); });
    });
    const addOpt = document.getElementById('addOpt');
    if(addOpt) addOpt.addEventListener('click', ()=>{
      if(state.decisionOptions.length<3){ state.decisionOptions.push(''); render(); }
    });

    const predictBtn = document.getElementById('predictBtn');
    if(predictBtn) predictBtn.addEventListener('click', ()=>{
      const valid = state.decisionOptions.filter(o=>o.trim().length>0);
      if(valid.length<2) return;
      const pickIdx = Math.floor(Math.random()*valid.length);
      const pct = 42 + Math.floor(Math.random()*34);
      state.predicted = {name: valid[pickIdx], pct};
      state.chosen = null;
      state.recorded = false;
      render();
    });

    document.querySelectorAll('.choice-row').forEach(row=>{
      row.addEventListener('click', ()=>{
        state.chosen = row.dataset.choice;
        state.recorded = true;

        // nudge the linked future branch + log to history
        if(state.decisionCategory){
          const futureName = catToFuture[state.decisionCategory];
          const top = futureTree.find(n=>n.name===futureName);
          if(top){
            const amount = 1 + Math.floor(Math.random()*2);
            top.pct += amount;
            state.lastBump = {name: futureName, amount};
          }
        }
        state.decisionHistory.unshift({
          date:'şimdi', cat: state.decisionCategory || '—',
          text: state.decisionText || '(başlıksız karar)',
          predicted: state.predicted.name, chosen: state.chosen,
          match: state.predicted.name === state.chosen
        });
        render();
      });
    });
  }

  if(state.screen==='morning'){
    document.querySelectorAll('.outcome-btns button').forEach(b=>{
      b.addEventListener('click', e=>{
        const idx = +e.target.closest('.morning-item').dataset.idx;
        state.log[idx].outcome = e.target.dataset.outcome;
        render();
      });
    });
    document.querySelectorAll('[data-context-idx]').forEach(ta=>{
      ta.addEventListener('input', e=>{ state.log[+e.target.dataset.contextIdx].context = e.target.value; });
    });
    document.querySelectorAll('.mood-actions button').forEach(b=>{
      b.addEventListener('click', e=>{
        const idx = +e.target.dataset.idx;
        if(e.target.dataset.mood==='duzelt'){ state.log[idx].moodEditing = true; }
        else { state.log[idx].moodConfirmed = 'onayla'; }
        render();
      });
    });
    document.querySelectorAll('[data-save-mood]').forEach(b=>{
      b.addEventListener('click', e=>{
        const idx = +e.target.dataset.saveMood;
        const val = document.getElementById('moodInput'+idx).value;
        state.log[idx].moodGuess = val;
        state.log[idx].moodEditing = false;
        state.log[idx].moodConfirmed = 'duzelt';
        render();
      });
    });
    const updateBtn = document.getElementById('updateTreeBtn');
    if(updateBtn) updateBtn.addEventListener('click', ()=>{
      state.treeUpdated = true;
      state.confidenceRising = true;
      render();
    });
  }

  if(state.screen==='ghost'){
    document.querySelectorAll('[data-ghost]').forEach(b=>{
      b.addEventListener('click', e=>{
        state.ghostActive = e.target.closest('[data-ghost]').dataset.ghost;
        render();
      });
    });
    document.querySelectorAll('[data-ghost-card]').forEach(card=>{
      card.addEventListener('click', ()=>{
        const key = card.dataset.ghostCard;
        state.ghostExpanded[key] = !state.ghostExpanded[key];
        render();
      });
    });
  }
}

render();
</script>
</body>
</html>
